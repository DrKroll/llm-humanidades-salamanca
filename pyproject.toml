[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhllm"
version = "0.1.0"
description = "Taller: entrena y ajusta pequeños modelos de lenguaje con tus propios textos (Humanidades Digitales)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Simon Kroll"}]
dependencies = [
  "torch>=2.3", "transformers>=4.46,<5", "tokenizers>=0.20", "peft>=0.13",
  "accelerate>=1.0", "pyyaml>=6.0", "matplotlib>=3.8", "numpy>=1.26", "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
